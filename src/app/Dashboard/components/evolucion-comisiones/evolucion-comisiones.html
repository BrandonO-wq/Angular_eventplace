<div class="card">
  <h3 class="card-title">Evolución de Comisiones</h3>
  <p class="card-subtitle">Comisiones cobradas, pendientes y monto bruto de reservas por mes</p>

  @if (months.length === 0) {
    <div class="empty-state">Sin datos de comisiones disponibles.</div>
  } @else {
    <div class="chart-container">
      <svg [attr.viewBox]="'0 0 ' + svgWidth + ' ' + svgHeight" class="chart-svg" preserveAspectRatio="xMidYMid meet">

        <defs>
          <linearGradient id="gradReservas" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
            <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.02"/>
          </linearGradient>
          <linearGradient id="gradComisiones" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#22c55e" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#22c55e" stop-opacity="0.02"/>
          </linearGradient>
          <linearGradient id="gradPendientes" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
            <stop offset="100%" stop-color="#f97316" stop-opacity="0.02"/>
          </linearGradient>
        </defs>

        <!-- Horizontal Grid Lines & Y Labels -->
        @for (tick of yTicks; track tick) {
          <line
            [attr.x1]="padLeft" [attr.y1]="yLabelX(tick)"
            [attr.x2]="svgWidth - padRight" [attr.y2]="yLabelX(tick)"
            stroke="#f0f4f8" stroke-width="1"/>
          <text
            [attr.x]="padLeft - 6" [attr.y]="yLabelX(tick) + 4"
            text-anchor="end" class="axis-label">{{ yLabel(tick) }}</text>
        }

        <!-- Bottom axis line -->
        <line
          [attr.x1]="padLeft" [attr.y1]="svgHeight - padBottom"
          [attr.x2]="svgWidth - padRight" [attr.y2]="svgHeight - padBottom"
          stroke="#e2e8f0" stroke-width="1.5"/>

        <!-- X Labels (months) -->
        @for (m of months; track m.label; let i = $index) {
          <text
            [attr.x]="padLeft + (i / (months.length > 1 ? months.length - 1 : 1)) * (svgWidth - padLeft - padRight)"
            [attr.y]="svgHeight - padBottom + 18"
            text-anchor="middle" class="axis-label">{{ m.label }}</text>
        }

        <!-- Filled Areas (drawn behind lines) -->
        <path [attr.d]="areaReservasPath"   fill="url(#gradReservas)"/>
        <path [attr.d]="areaComisionesPath" fill="url(#gradComisiones)"/>
        <path [attr.d]="areaPendientesPath" fill="url(#gradPendientes)"/>

        <!-- Blue Smooth Line (Reservas) -->
        <path [attr.d]="reservasPath" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        @for (dot of reservasDots; track dot.cx) {
          <circle [attr.cx]="dot.cx" [attr.cy]="dot.cy" r="4.5" fill="white" stroke="#3b82f6" stroke-width="2.5"/>
        }

        <!-- Green Smooth Line (Comisiones) -->
        <path [attr.d]="comisionesPath" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        @for (dot of comisionesDots; track dot.cx) {
          <circle [attr.cx]="dot.cx" [attr.cy]="dot.cy" r="4" fill="white" stroke="#22c55e" stroke-width="2.5"/>
        }

        <!-- Orange Smooth Line (Pendientes) -->
        <path [attr.d]="pendientesPath" fill="none" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
        @for (dot of pendientesDots; track dot.cx) {
          <circle [attr.cx]="dot.cx" [attr.cy]="dot.cy" r="4" fill="white" stroke="#f97316" stroke-width="2.5"/>
        }

      </svg>
    </div>

    <div class="legend">
      <div class="legend-item">
        <div class="legend-line" style="background:#22c55e;"></div>
        <span>Comisiones cobradas (S/)</span>
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#f97316;"></div>
        <span>Pendientes por cobrar (S/)</span>
      </div>
      <div class="legend-item">
        <div class="legend-line" style="background:#3b82f6;"></div>
        <span>Monto bruto de reservas (S/)</span>
      </div>
    </div>
  }

</div>
